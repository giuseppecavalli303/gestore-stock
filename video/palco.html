<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Palco video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Palco 1920x1080 del video: testo a sinistra, app dentro un telefono (o un portatile) a destra */
:root{--bg:#060b13;--ink:#edf2f9;--ink2:#a8b5c8;--accent:#62a4ff;--violet:#ab9dff;--edge:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Onest","Segoe UI",sans-serif}
.sky{position:absolute;inset:0;overflow:hidden}
.sky i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.8}
.sky i:nth-child(1){width:900px;height:900px;left:-300px;top:-380px;background:#12408c}
.sky i:nth-child(2){width:700px;height:700px;right:-160px;top:140px;background:#0b5c57}
.sky i:nth-child(3){width:620px;height:620px;left:420px;bottom:-420px;background:#40288a}
.testo{position:absolute;left:120px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.pc .testo{left:70px;width:500px}
.marchio{display:flex;align-items:center;gap:16px;font-weight:600;color:var(--ink2);font-size:24px}
.marchio b{color:var(--ink)}
.mark{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(150deg,#0a5cf5,#5a45d6)}
.passo{font-size:22px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-size:76px;line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.pc h1{font-size:58px}
.desc{font-size:31px;line-height:1.4;color:var(--ink2);margin:0;text-wrap:pretty}
.pc .desc{font-size:26px}
.desc b{color:var(--ink);font-weight:600}
.url{display:inline-block;margin-top:6px;padding:12px 20px;border-radius:999px;background:rgba(98,164,255,.14);color:var(--accent);font-weight:600;font-size:26px}
.telefono{position:absolute;right:250px;top:50%;transform:translateY(-50%);width:478px;height:1010px;border-radius:66px;padding:18px;background:#0b0f16;border:2px solid #2a3344;box-shadow:0 40px 120px -30px rgba(0,0,0,.9),inset 0 0 0 6px #151b26}
.schermo{width:442px;height:956px;border-radius:50px;overflow:hidden;position:relative;background:#000}
#wrap{width:390px;height:844px;transform:scale(1.1333);transform-origin:0 0}
#app{width:390px;height:844px;border:0;display:block}
.portatile{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:1300px;padding:10px;border-radius:22px;background:#0b0f16;border:2px solid #2a3344;box-shadow:0 40px 120px -30px rgba(0,0,0,.9);display:none}
.pc .telefono{display:none}
.pc .portatile{display:block}
#app2{width:1280px;height:800px;border:0;display:block;border-radius:14px}
#tap{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid #fff;background:rgba(98,164,255,.45);box-shadow:0 0 0 10px rgba(98,164,255,.25);display:none;z-index:9}
#sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1500px;padding:14px 28px;border-radius:16px;background:rgba(0,0,0,.62);font-size:30px;line-height:1.35;text-align:center;display:none}
</style>
</head>
<body>
<div class="sky"><i></i><i></i><i></i></div>
<section class="testo">
  <div class="marchio"><span class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.6-4.6A2 2 0 0 1 8.5 7h7a2 2 0 0 1 1.9 1.4L19 13"/><rect x="3" y="13" width="18" height="5" rx="2"/><circle cx="7.5" cy="18" r="1.4"/><circle cx="16.5" cy="18" r="1.4"/></svg></span><span><b>Stock Usato</b> · guida per i venditori</span></div>
  <div class="passo" id="passo"></div>
  <h1 id="titolo"></h1>
  <p class="desc" id="desc"></p>
</section>
<div class="telefono"><div class="schermo"><div id="wrap"><iframe id="app" src="/index.html"></iframe></div></div></div>
<div class="portatile"><iframe id="app2"></iframe></div>
<div id="tap"></div>
<div id="sub"></div>
<script>
function scena(s, i, n) {
  document.body.classList.toggle('pc', !!s.pc);
  document.getElementById('passo').textContent = i ? `${i} di ${n}` : '';
  document.getElementById('titolo').textContent = s.titolo;
  document.getElementById('desc').innerHTML = s.desc;
}
function tocco(x, y) { const t = document.getElementById('tap'); t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.display = 'block'; }
function viaTocco() { document.getElementById('tap').style.display = 'none'; }
</script>
</body>
</html>
